    <main>
      <h1 style="text-align:center;">Formulario de consultas</h1>
      <p style="text-align:center;">Completá los datos obligatorios para que podamos responder tu consulta.</p>

      <section style="display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; align-items: flex-start; max-width: 960px; margin: 40px auto;">

        <!-- Columna izquierda: Formulario -->
        <div style="flex: 1 1 400px;">
          <form action="mailto:pzmaquinas82@gmail.com" method="post" enctype="text/plain">
            <label for="nombre">Nombre: <span style="color:red">*</span></label><br>
            <input type="text" id="nombre" name="Nombre" required><br><br>

            <label for="apellido">Apellido: <span style="color:red">*</span></label><br>
            <input type="text" id="apellido" name="Apellido" required><br><br>

            <label for="telefono">Teléfono: <span style="color:red">*</span></label><br>
            <input type="tel" id="telefono" name="Teléfono" required><br><br>

            <label for="correo">Correo electrónico: <span style="color:red">*</span></label><br>
            <input type="email" id="correo" name="Correo" required><br><br>

            <label for="consulta">Consulta:</label><br>
            <textarea id="consulta" name="Consulta" rows="5"></textarea><br><br>

            <input type="submit" value="Enviar consulta">
          </form>
        </div>

        <!-- Columna derecha: Imagen decorativa -->
        <div style="flex: 1 1 300px; background-image: url('img/logoface.png'); background-size: contain; background-repeat: no-repeat; background-position: center; height: 400px;">
        </div>

      </section>
    </main>
